<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav>
        <section id="top-nav">
          <div class="top-nav-left">
            <div class="btn" style="background-color: #ffe51fff">
              <img
                src="https://rukminim2.flixcart.com/fk-p-flap/52/44/image/d2ecfddf891a3922.png?q=90"
                alt=""
              />
              <img
                src="https://rukminim2.flixcart.com/fk-p-flap/92/36/image/31f7e3af490c225f.png?q=60"
                alt=""
              />
            </div>
            <div style="background-color: gainsboro" class="btn">✈️ Travel</div>
          </div>
          <div class="top-nav-right">
            <i class="fa-sharp fa-solid fa-location-dot"></i>
            <p>Location : Vadodra</p>
          </div>
        </section>

        <section id="bottom-nav">
          <div class="btn-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" />
          </div>
          <div class="login-box">
            <div class="login-box-items">
              <i class="fa-regular fa-circle-user"></i>
              <p>Login</p>
            </div>
            <div class="login-box-items">
              <p>More</p>
            </div>
            <div class="login-box-items">
              <i class="fa-solid fa-cart-arrow-down"></i>
              <p>Cart</p>
            </div>
          </div>
        </section>
        <section id="icons-box">
          <div class="icons-items">
            <img
              src="https://static-assets-web.flixcart.com/apex-static/images/svgs/L1Nav/all.svg"
              alt=""
            />
            <p>Bags</p>
          </div>
          <div class="icons-items">
            <img
              src="https://static-assets-web.flixcart.com/apex-static/images/svgs/L1Nav/fashion.svg"
              alt=""
            />
            <p>Fashion</p>
          </div>
          <div class="icons-items">
            <img
              src="https://static-assets-web.flixcart.com/apex-static/images/svgs/L1Nav/mobiles.svg"
              alt=""
            />
            <p>Mobile</p>
          </div>
          <div class="icons-items">
            <img
              src="https://static-assets-web.flixcart.com/apex-static/images/svgs/L1Nav/beauty.svg"
              alt=""
            />
            <p>Beauty</p>
          </div>
          <div class="icons-items">
            <img
              src="https://static-assets-web.flixcart.com/apex-static/images/svgs/L1Nav/electronics.svg"
              alt=""
            />
            <p>Computers</p>
          </div>
          <div class="icons-items">
            <img
              src="https://static-assets-web.flixcart.com/apex-static/images/svgs/L1Nav/home-final.svg"
              alt=""
              style="width: 35px; height: 35px; box-sizing: border-box"
            />
            <p>Electronics</p>
          </div>
          <div class="icons-items">
            <img
              src="https://static-assets-web.flixcart.com/apex-static/images/svgs/L1Nav/tv.svg"
              alt=""
            />
            <p>Appliances</p>
          </div>
          <div class="icons-items">
            <img
              src="https://static-assets-web.flixcart.com/apex-static/images/svgs/L1Nav/toy.svg"
              alt=""
            />
            <p>Toys</p>
          </div>
          <div class="icons-items">
            <img
              src="https://static-assets-web.flixcart.com/apex-static/images/svgs/L1Nav/food.svg"
              alt=""
            />
            <p>Food</p>
          </div>
          <div class="icons-items">
            <img
              src="https://static-assets-web.flixcart.com/apex-static/images/svgs/L1Nav/food.svg"
              alt=""
            />
            <p>Food</p>
          </div>
          <div class="icons-items">
            <img
              src="https://static-assets-web.flixcart.com/apex-static/images/svgs/L1Nav/food.svg"
              alt=""
            />
            <p>Food</p>
          </div>
          <div class="icons-items">
            <img
              src="https://static-assets-web.flixcart.com/apex-static/images/svgs/L1Nav/food.svg"
              alt=""
            />
            <p>Food</p>
          </div>
          <div class="icons-items">
            <img
              src="https://static-assets-web.flixcart.com/apex-static/images/svgs/L1Nav/food.svg"
              alt=""
            />
            <p>Food</p>
          </div>
        </section>
      </nav>
    </header>
  </body>
</html>
