<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="actions.html" method="get">
      <h1>Sports Physical Form</h1>
      <fieldset>
        <legend>Athlete information</legend>
        <ul>
          <li>
            <label for="name">Name</label>
            <input type="text" name="usename" id="name" />
          </li>
          <li>
            <label for="School/Team">School/Team</label>
            <input type="text" name="School/Team" id="School/Team" />
          </li>
          <li>
            <label for="sport">sports</label>
            <input type="text" name="sport" id="sport" />
          </li>
          <li>
            <label for="parents/Guardian-Name">parents/Guardian-Name</label>
            <input
              type="text"
              name="parents/Guardian-Name"
              id="parents/Guardian-Name"
            />
          </li>
          <li>
            <label for="Contact-no">Contact-no</label>
            <input type="text" name="Contact-no" id="Contact-no" />
          </li>
        </ul>
      </fieldset>
      <fieldset><legend>Medical History of Athlete</legend></fieldset>
      <fieldset>
        <legend>Doctor's recommendations for sport participations</legend>
      </fieldset>
      <button type="submit">Submit Form</button>
    </form>
  </body>
</html>
