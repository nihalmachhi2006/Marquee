<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="" method="get">
      <table>
        <thead>
          <th>STUDENT REGISTRATION FORM</th>
        </thead>
        <tbody>
          <tr>
            <td>
              <label for="fname">First Name</label>
            </td>
            <td>
              <input type="text" name="fname" id="fname" /> (mas 30 characters
              a-z and A-Z)
            </td>
          </tr>
          <tr>
            <td>
              <label for="fname">Last Name</label>
            </td>
            <td>
              <input type="text" name="lname" id="lname" />(mas 30 characters
              a-z and A-Z)
            </td>
          </tr>
          <tr>
            <td>
              <label for="dob">DOB</label>
            </td>
            <td>
              <input type="date" name="dob" id="dob" />
            </td>
          </tr>
          <tr>
            <td>
              <label for="email">Email</label>
            </td>
            <td>
              <input type="email" name="email" id="email" />
            </td>
          </tr>
          <tr>
            <td>
              <label for="mnumber">Mobile Number</label>
            </td>
            <td>
              <input type="text" name="mnumber" id="mnumber" />(10 digit number)
            </td>
          </tr>
          <tr>
            <td>Gender</td>
            <td>
              <input type="radio" name="male" id="male" />
              <label for="male">Man</label>
              <input type="radio" name="female" id="female" />
              <label for="female">female</label>
            </td>
          </tr>
          <tr>
            <td><label for="address">Address</label></td>
            <td><textarea name="address" id="address"></textarea></td>
          </tr>
          <tr>
            <td>
              <label for="city">City</label>
            </td>
            <td>
              <input type="text" name="city" id="city" />
            </td>
          </tr>
          <tr>
            <td>
              <label for="pincode">pincode</label>
            </td>
            <td>
              <input type="text" name="pincode" id="pincode" />
            </td>
          </tr>
          <tr>
            <td>
              <label for="state">state</label>
            </td>
            <td>
              <input type="text" name="state" id="state" />
            </td>
          </tr>
          <tr>
            <td>
              <label for="country">country</label>
            </td>
            <td>
              <input type="text" name="country" id="country" />
            </td>
          </tr>
          <tr>
            <td><form action="hoddy">Hoddies</form></td>
            <td>
              <select name="hoddy" id="hoddy">
                <option value="Select your hoddies">Select your hoddies</option>
                <option value="Dancing">Dancing</option>
                <option value="coding">coding</option>
                <option value="debug">debug</option>
                <option value="tailwind">tailwind</option>
              </select>
            </td>
          </tr>
          <tr>
            <td><label for="QUALIFICATION">QUALIFICATION</label></td>
            <td>
              <table>
                <thead>
                  <tr>
                    <th>Sr.no</th>
                    <th>Examination</th>
                    <th>Board</th>
                    <th>Percentage</th>
                    <th>Year of Passing</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>1</td>
                    <td>Class_X</td>
                    <td>
                      <label for="board"></label>
                      <input type="text" name="board" id="board" />
                    </td>
                    <td>
                      <label for="Percentage"></label>
                      <input type="text" name="Percentage" id="Percentage" />
                    </td>
                    <td>
                      <label for="yop"></label>
                      <input type="yop" name="yop" id="yop" />
                    </td>
                  </tr>
                  <tr>
                    <td>2</td>
                    <td>Class_XII</td>
                    <td>
                      <label for="board"></label>
                      <input type="text" name="board" id="board" />
                    </td>
                    <td>
                      <label for="Percentage"></label>
                      <input type="text" name="Percentage" id="Percentage" />
                    </td>
                    <td>
                      <label for="yop"></label>
                      <input type="yop" name="yop" id="yop" />
                    </td>
                  </tr>
                  <tr>
                    <td>3</td>
                    <td>Graduation</td>
                    <td>
                      <label for="board"></label>
                      <input type="text" name="board" id="board" />
                    </td>
                    <td>
                      <label for="Percentage"></label>
                      <input type="text" name="Percentage" id="Percentage" />
                    </td>
                    <td>
                      <label for="yop"></label>
                      <input type="yop" name="yop" id="yop" />
                    </td>
                  </tr>
                  <tr>
                    <td>4</td>
                    <td>Masters</td>
                    <td>
                      <label for="board"></label>
                      <input type="text" name="board" id="board" />
                    </td>
                    <td>
                      <label for="Percentage"></label>
                      <input type="text" name="Percentage" id="Percentage" />
                    </td>
                    <td>
                      <label for="yop"></label>
                      <input type="yop" name="yop" id="yop" />
                    </td>
                  </tr>
                </tbody>
              </table>
            </td>
          </tr>
          <tr>
            <td>Courses</td>
            <td>
              <input type="checkbox" name="hobbies" />
              <label for="reading">BCA</label>
              <input type="checkbox" name="hobbies" />
              <label for="writing">B.Com</label>
              <input type="checkbox" name="hobbies" />
              <label for="sports">B.Sc</label>
              <input type="checkbox" name="hobbies" />
              <label for="music">B.A</label>
            </td>
          </tr>

          <tr>
            <td><input type="button" value="Submit" /></td>
            <td><input type="reset" value="Reset" /></td>
          </tr>
        </tbody>
      </table>
    </form>
  </body>
</html>

<!-- Sl.No. Examination
Board
Percentage
Year of Passing
1
Class X
2
Class XII
3
Graduation
4
Masters
(10 char max)
