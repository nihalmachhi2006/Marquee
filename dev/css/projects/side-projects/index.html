<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Technologies Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }

      body {
        background-color: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 10px;
      }
      .dashboard-container {
        display: flex;
        width: 90%;
        max-width: 1150px;
        height: 550px;
        background-color: #ffffff;
        border-radius: 10px;
        overflow: hidden;
      }
      .sidebar {
        width: 25%;
        background-color: #0056b3;
        color: #ffffff;
        padding: 20px 10px;
      }

      .sidebar-title {
        font-size: 30px;
        font-weight: bold;
        text-align: center;
        margin-bottom: 20px;
      }

      .nav-menu {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .nav-item {
        color: #ffffff;
        text-decoration: none;
        padding: 10px 10px;
        border-radius: 8px;
        font-size: 16px;
      }
      .nav-item.active {
        background-color: #ffffff;
        color: #0056b3;
        font-weight: bold;
      }

      .content-area {
        width: 65%;
        background-color: #ffffff;
        padding: 40px;
      }

      .content-title {
        font-size: 20px;
        color: #0056b3;
        margin-bottom: 30px;
        display: inline-block;
        padding-bottom: 2px;
      }
      .card-items {
        height: 60px;
        width: 80px;
      }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <aside class="sidebar">
        <h2 class="sidebar-title">Technologies</h2>
        <nav class="nav-menu">
          <a href="#" class="nav-item active">Frontend</a>
          <a href="#" class="nav-item">Backend</a>
          <a href="#" class="nav-item">Mobile</a>
          <a href="#" class="nav-item">Platforms</a>
          <a href="#" class="nav-item">Databases</a>
        </nav>
      </aside>
      <main class="content-area">
        <h1 class="content-title">Frontend</h1>

        <div class="card-items">
          <div>Angular JS</div>
          <div>React JS</div>
          <div>Vue JS</div>
          <div>JavaScript</div>
          <div>CSS</div>
          <div>HTML</div>
          <div>NextJS</div>
        </div>
      </main>
    </div>
  </body>
</html>
